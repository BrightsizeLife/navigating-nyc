# Publishes docs/ to GitHub Pages on every push to main.
#
# Mechanism: force-push the docs/ folder to a gh-pages branch. The default
# workflow token can push branches (contents: write) but is NOT allowed to
# call the Pages "create site" API — actions/configure-pages enablement
# fails with "Resource not accessible by integration" — so serving needs a
# ONE-TIME manual step: Settings → Pages → Deploy from a branch →
# gh-pages / root. After that click, every merge to main republishes and
# Pages redeploys on its own. The .nojekyll file skips the Jekyll build so
# the folder is served exactly as committed.
name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: publish docs/ to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git commit -m "deploy: docs/ at ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
